name: Build testing branch

# Same steps as the "Plugin NRO" job in rust.yml, but triggered by pushes to testing/* branches
# (and on demand) and without the beta-release step. Uploads libtraining_modpack.nro as an artifact.

on:
  push:
    branches:
      - "testing/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin NRO (testing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        name: Rust Cache
        with:
          prefix-key: "plugin"
          cache-all-crates: true
      - name: Install Skyline
        run: |
          cargo install --git https://github.com/jam1garner/cargo-skyline --force
          cargo-skyline skyline update-std
      - name: Build release NRO
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Checksums
        run: |
          mkdir -p out
          cp target/aarch64-skyline-switch/release/libtraining_modpack.nro out/
          sha256sum out/*.nro | tee out/SHA256SUMS.txt
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: "training-modpack-run${{ github.run_id }}-${{ github.sha }}"
          path: out/
          if-no-files-found: error
